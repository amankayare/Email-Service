version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: email-redis
    ports:
      - "6379:6379"

  email-api:
    build:
      context: .
      dockerfile: EmailService.API/Dockerfile
    container_name: email-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Redis=redis:6379
      - ApiKey=${API_KEY}
      - Dashboard__ApiKey=${DASHBOARD_API_KEY}
      - EmailSettings__Provider=${EMAIL_PROVIDER}
      - EmailSettings__FromEmail=${FROM_EMAIL}
      - EmailSettings__SendGridApiKey=${SENDGRID_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    depends_on:
      - redis

  email-worker:
    build:
      context: .
      dockerfile: EmailService.Worker/Dockerfile
    container_name: email-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
      - EmailSettings__Provider=${EMAIL_PROVIDER}
      - EmailSettings__FromEmail=${FROM_EMAIL}
      - EmailSettings__SendGridApiKey=${SENDGRID_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    depends_on:
      - redis

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Restore
        run: dotnet restore "EmailService.sln"

      - name: Verify formatting
        run: dotnet format "EmailService.sln" --verify-no-changes

      - name: Build
        run: dotnet build "EmailService.sln" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "./EmailService.Tests/EmailService.Tests.csproj" --no-build --verbosity normal
